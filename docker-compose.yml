services:
  suntoday:
    restart: always
    # The save directory is an NFS share that squashes root, so the container
    # must run as a non-root uid that can write there. Set HOST_UID/HOST_GID in
    # .env per host (e.g. `id -u ec2-user` on the VM, `id -u` locally); the
    # default is uid 500, which owns the legacy date directories on the share.
    user: "${HOST_UID:-500}:${HOST_GID:-500}"
    # uid 500 has no home in the image; sunpy/astropy need a writable
    # config/cache dir.
    environment:
      HOME: /tmp
    env_file:
      - .env
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      # This should be changed to point towards the final location for the images on the VM
      # The left side is the host path, the right side is the container path
      - ${SUNTODAY_HOST_SAVE_DIRECTORY:-./images}:/app/images:Z
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: suntoday_user
      POSTGRES_DB: suntoday
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suntoday_user -d suntoday"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port published: the app and adminer reach the DB over the internal
    # compose network, so the raw trust-auth Postgres port is never exposed.

  # DB browser. Reaches the DB internally (System: PostgreSQL, Server: db,
  # User: suntoday_user, Database: suntoday, no password). Only its web UI is
  # published, not the Postgres port.
  adminer:
    image: adminer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 1234:8080

volumes:
  pgdata:
