version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    exclude-paths:
      - "requirements-*"
    ignore:
      # 3.11 adds about 0.5 GiB to the job's peak memory on the 4 GB host.
      - dependency-name: "matplotlib"
        versions: [">=3.11"]
    groups:
      all-dependencies:
        patterns:
          - "*"
      all-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
      all-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
