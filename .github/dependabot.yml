version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    exclude-paths:
      - "requirements-*"
    ignore:
      # mplcairo 0.6.1 breaks with matplotlib 3.11; drop this once mplcairo supports it.
      - dependency-name: "matplotlib"
        versions: [">=3.11"]
    groups:
      all-dependencies:
        patterns:
          - "*"
      all-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
      all-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
