name: Unit tests

on:
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled: a new push to the same PR makes the run
# in flight pointless, and GitHub Actions otherwise lets it finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          submodules: recursive
      - name: Install cairo build deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Match the Docker runtime. mplcairo has no cp314 wheel yet.
          python-version: "3.13"
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run offline unit tests
        run: tox -e py

  online:
    name: Online (remote-data) unit tests
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          submodules: recursive
      - name: Install cairo build deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run online unit tests
        env:
          SUNTODAY_JSOC_USER: ${{ secrets.SUNTODAY_JSOC_USER }}
          SUNTODAY_JSOC_PASSWORD: ${{ secrets.SUNTODAY_JSOC_PASSWORD }}
        run: tox -e py-online
