name: Unit tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Match the Docker runtime. mplcairo has no cp314 wheel yet.
          python-version: "3.13"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run offline unit tests
        run: tox -e py

  online:
    name: Online (remote-data) unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run online unit tests
        env:
          SUNTODAY_JSOC_USER: ${{ secrets.SUNTODAY_JSOC_USER }}
          SUNTODAY_JSOC_PASSWORD: ${{ secrets.SUNTODAY_JSOC_PASSWORD }}
        run: tox -e py-online
