exclude: ".*(.csv|.fits|.fts|.fit|.header|.jpg|.jpeg|.json|.png|.svg)$"
repos:
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args:
          [
            "--in-place",
            "--remove-all-unused-imports",
            "--remove-unused-variable",
          ]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.5"
    hooks:
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--preview"]
      - id: ruff-format
        args: ["--preview"]
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        additional_dependencies: ["tomli>=2,<3"]
        args: ["--make-summary-multi-line", "--pre-summary-newline", "-ri"]
  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [css, scss, javascript, rst, json, yaml, toml, markdown]
        # pre-commit passes npm flags that npm >= 11 rejects, so use a
        # pre-commit-managed node (bundled npm 10) instead of the system one.
        language_version: "20.19.0"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.50.1
    hooks:
      - id: typos
ci:
  autofix_prs: false
  autoupdate_schedule: "quarterly"
