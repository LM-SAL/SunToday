[tox]
min_version = 4.0
requires =
    tox-uv
envlist =
    py{,-online,-figure}
    codestyle

[testenv]
description =
    run tests
    online: runs tests that require remote data
    figure: renders every figure product plus a browsable HTML summary of them
setenv =
    COLUMNS = 180
    PYTEST_COMMAND = pytest -vvv -s -raR
    SUNTODAY_TEST_ENV = True
    OPENBLAS_NUM_THREADS = 1
    OMP_NUM_THREADS = 1
    MKL_NUM_THREADS = 1
    NUMEXPR_NUM_THREADS = 1
passenv =
    SUNTODAY_JSOC_USER
    SUNTODAY_JSOC_PASSWORD
deps =
    -rrequirements.txt
    -rrequirements-test.txt
commands =
    uv pip freeze
    !figure-!online: {env:PYTEST_COMMAND} -n auto -m "not mpl_image_compare and not remote_data" {posargs}
    online: {env:PYTEST_COMMAND} -n auto --remote-data=any -m "remote_data and not mpl_image_compare" {posargs}
    figure: {env:PYTEST_COMMAND} -m "mpl_image_compare and not remote_data" --mpl-generate-path="{toxinidir}/figure_test_images/rendered" --mpl-generate-summary=html {posargs}

[testenv:codestyle]
pypi_filter =
skip_install = true
description = Run all style and file checks with pre-commit
deps =
    pre-commit
commands =
    pre-commit install-hooks
    pre-commit run --all-files
