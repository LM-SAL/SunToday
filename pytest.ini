[pytest]
testpaths = src
norecursedirs = .tox build docs/_build docs/generated *.egg-info .history tools .hypothesis images pgdata
doctest_plus = enabled
doctest_optionflags = NORMALIZE_WHITESPACE FLOAT_CMP ELLIPSIS
text_file_format = rst
addopts = -p no:unraisableexception -p no:threadexception
remote_data_strict = False
mpl-results-path = figure_test_images
mpl-use-full-test-name = True
mpl-default-style = default
mpl-default-backend = module://mplcairo.base
# mplcairo passes None-valued PNG metadata straight to Pillow, which crashes,
# so the deterministic metadata injection must stay off (pixel comparison
# ignores metadata anyway).
mpl-deterministic = false
filterwarnings =
    error
    # Do not fail on pytest config issues (i.e. missing plugins) but do show them
    always::pytest.PytestConfigWarning
    #
    # A list of warnings to ignore follows. If you add to this list, you MUST
    # add a comment or ideally a link to an issue that explains why the warning
    # is being ignored
    #
    ignore:unclosed:ResourceWarning
    # Wait for upstream fixes
    ignore:.*unit for NumPy timedelta is deprecated.*:DeprecationWarning
